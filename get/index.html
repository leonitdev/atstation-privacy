<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get AtStation</title>
<meta name="description" content="AtStation: Fun While You Wait. A calm stacking game for your commute.">
<meta property="og:title" content="AtStation: Fun While You Wait">
<meta property="og:description" content="Stack towers, stamp 30 cities. Free to start on iPhone and Android.">
<style>
  :root { --bg:#090F1F; --surface:#111A30; --text:#EEF1F8; --muted:#94A0B8; --teal:#26E9D3; --line:#1E2A45; }
  * { box-sizing: border-box; }
  [hidden] { display:none !important; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--text);
         font:17px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif; padding:24px 16px; }
  main { max-width:420px; width:100%; text-align:center; }
  .brand { font-weight:700; font-size:34px; letter-spacing:-0.02em; margin:16px 0 4px; }
  .brand span { color:var(--teal); }
  p { color:var(--muted); margin:0 0 28px; }
  a.btn { display:block; padding:16px; border-radius:16px; text-decoration:none; font-weight:600; margin-bottom:12px;
          background:var(--surface); color:var(--text); border:1px solid var(--line); }
  a.btn.primary { background:var(--teal); color:#06101E; border-color:var(--teal); }
  small { color:var(--muted); display:block; margin-top:20px; }
</style>
</head>
<body>
<main>
  <svg width="88" height="88" viewBox="0 0 1024 1024" aria-hidden="true">
    <rect width="1024" height="1024" rx="230" fill="#111A30"/>
    <rect x="120" y="244" width="783" height="112" rx="56" fill="#26E9D3"/>
    <rect x="225" y="340" width="60" height="400" fill="#26E9D3"/>
    <rect x="713" y="340" width="60" height="400" fill="#26E9D3"/>
    <rect x="150" y="726" width="748" height="54" rx="27" fill="#26E9D3"/>
    <rect x="366" y="637" width="286" height="79" rx="20" fill="#26E9D3"/>
    <rect x="350" y="544" width="274" height="83" rx="20" fill="#26E9D3"/>
    <path d="M400 395h196a30 30 0 0 1 30 30v78a30 30 0 0 1-30 30H400a30 30 0 0 1-30-30v-78a30 30 0 0 1 30-30zm15 45h173a18 18 0 0 1 0 66H415a18 18 0 0 1 0-66z" fill="#26E9D3" fill-rule="evenodd"/>
    <rect x="833" y="500" width="27" height="240" fill="#26E9D3"/>
    <circle cx="847.5" cy="458" r="54" fill="#FD7B5E"/>
  </svg>
  <div class="brand">At<span>Station</span></div>
  <p id="tagline">Fun while you wait. Stack towers, stamp 30 cities.</p>
  <a id="open" class="btn primary" hidden>Accept in AtStation</a>
  <a id="primary" class="btn primary" href="https://apps.apple.com/app/id6821316557">Download</a>
  <a class="btn" href="https://apps.apple.com/app/id6821316557">App Store (iPhone, iPad)</a>
  <a class="btn" href="https://play.google.com/store/apps/details?id=com.atstation.app">Google Play (Android)</a>
  <p id="after" hidden></p>
  <small>Free to start · no ads</small>
</main>
<script>
  // Send each phone straight to its own store; desktops see both buttons.
  // A challenge link stays here first: it can open the app, which a redirect can't.
  (function () {
    var ios = 'https://apps.apple.com/app/id6821316557';
    var android = 'https://play.google.com/store/apps/details?id=com.atstation.app';
    var ua = navigator.userAgent || '';
    var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var isAndroid = /Android/i.test(ua);
    var primary = document.getElementById('primary');
    var CITIES = {"london":"London","paris":"Paris","rome":"Rome","amsterdam":"Amsterdam","barcelona":"Barcelona","tokyo":"Tokyo","bangkok":"Bangkok","mumbai":"Mumbai","dubai":"Dubai","seoul":"Seoul","cairo":"Cairo","marrakech":"Marrakech","nairobi":"Nairobi","capetown":"Cape Town","lagos":"Lagos","newyork":"New York","mexicocity":"Mexico City","buenosaires":"Buenos Aires","riodejaneiro":"Rio de Janeiro","vancouver":"Vancouver","sydney":"Sydney","melbourne":"Melbourne","auckland":"Auckland","fiji":"Fiji","honolulu":"Honolulu","reykjavik":"Reykjavik","tromso":"Tromso","thepole":"The Pole","svalbard":"Svalbard","ultima":"Ultima"};
    var q = new URLSearchParams(location.search);
    var city = q.get('c');
    var score = q.get('s');
    if (Object.prototype.hasOwnProperty.call(CITIES, city) && /^[1-9][0-9]{0,3}$/.test(score)) {
      var query = 'challenge?c=' + city + '&s=' + score;
      document.title = 'Beat ' + score + ' in ' + CITIES[city];
      document.getElementById('tagline').textContent = 'A friend challenges you: beat ' + score + ' in ' + CITIES[city] + '.';
      var after = document.getElementById('after');
      after.textContent = 'Just installed? Come back here and tap Accept, or enter code ' + city + ' ' + score + ' in the app.';
      after.hidden = false;
      if (isIOS || isAndroid) {
        var open = document.getElementById('open');
        open.href = isAndroid
          ? 'intent://' + query + '#Intent;scheme=atstation;package=com.atstation.app;S.browser_fallback_url=' + encodeURIComponent(android) + ';end'
          : 'atstation://' + query;
        open.hidden = false;
        primary.className = 'btn';
        primary.href = isAndroid ? android : ios;
        primary.textContent = isAndroid ? 'Get it on Google Play' : 'Get it on the App Store';
      }
      return;
    }
    if (isAndroid) { primary.href = android; primary.textContent = 'Get it on Google Play'; location.replace(android); }
    else if (isIOS) { primary.textContent = 'Download on the App Store'; location.replace(ios); }
  })();
</script>
</body>
</html>
